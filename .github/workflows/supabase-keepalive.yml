name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 04:00 UTC every 4 days to prevent Supabase 7-day inactivity pause
    - cron: '0 4 */4 * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Supabase
        run: |
          SUPABASE_URL="https://hdslcknwkzzejzbgehif.supabase.co"
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhkc2xja253a3p6ZWp6YmdlaGlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDA4NzgsImV4cCI6MjEwNzg3Njg3OH0.r8sR1mwVMRBjSUZhkEdLNMx1T4nVICrT45Zj6uDzxIk' }}"

          echo "Pinging Supabase REST and Auth endpoints to keep project active..."
          REST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" "$SUPABASE_URL/rest/v1/")
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $ANON_KEY" "$SUPABASE_URL/auth/v1/health")

          echo "REST API HTTP Status: $REST_STATUS"
          echo "Auth Health HTTP Status: $AUTH_STATUS"

          if [ "$REST_STATUS" -eq 200 ] || [ "$AUTH_STATUS" -eq 200 ]; then
            echo "Success! Supabase project hdslcknwkzzejzbgehif received active traffic and will not be paused."
          else
            echo "Notice: Endpoints responded with REST: $REST_STATUS, Auth: $AUTH_STATUS"
          fi
